name: Decompile NRO JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "NRO-Offline-1.0.4.jar"
      - ".github/workflows/decompile.yml"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check input JAR
        run: |
          test -f "NRO-Offline-1.0.4.jar" || {
            echo "Khong tim thay NRO-Offline-1.0.4.jar o thu muc goc repository."
            exit 1
          }

      - name: Download CFR decompiler
        run: |
          curl --fail --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar" \
            --output cfr.jar

      - name: Decompile JAR
        run: |
          mkdir -p decompiled
          java -jar cfr.jar "NRO-Offline-1.0.4.jar" \
            --outputdir decompiled \
            --silent true

      - name: Create ZIP
        run: |
          test -n "$(find decompiled -type f -name '*.java' -print -quit)" || {
            echo "Decompiler khong tao ra file Java nao."
            exit 1
          }
          zip -qr NRO-Offline-1.0.4-decompiled.zip decompiled

      - name: Upload decompiled source
        uses: actions/upload-artifact@v4
        with:
          name: NRO-Offline-1.0.4-decompiled
          path: NRO-Offline-1.0.4-decompiled.zip
          if-no-files-found: error
          retention-days: 14
